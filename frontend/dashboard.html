<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Firma Digital</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos extra para la vista previa */
        #preview-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px dashed #eee;
            display: none; /* Oculto por defecto */
        }
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .file-info {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">🔒 Mi Panel Seguro</div>
        <nav>
            <span id="user-display">Cargando...</span>
            <a href="#" id="logout-btn" style="margin-left: 15px; color: #ffadad;">Salir</a>
        </nav>
    </header>

    <div class="container">
        <div id="status-msg"></div>

        <div class="card">
            <h3>1. Mi Certificado Digital</h3>
            <p>Genera tu par de claves e identidad digital.</p>
            <button id="btn-cert" class="btn">Emitir / Renovar Certificado</button>
        </div>

        <div class="card">
            <h3>2. Firmar Documento PDF</h3>
            <p>Sube tu PDF. Podrás previsualizarlo antes de firmar.</p>
            <form id="sign-form">
                <div class="form-group">
                    <input type="file" id="pdf-file" accept="application/pdf" required>
                </div>

                <div id="preview-container">
                    <h4>📄 Vista Previa del Documento</h4>
                    <div class="file-info" id="file-name-display"></div>
                    <iframe id="pdf-preview" src=""></iframe>
                </div>
                <br>
                <button type="submit" class="btn btn-success">Firmar y Descargar</button>
            </form>
        </div>
    </div>

    <script type="module">
        import { emitirCertificado, firmarPDF } from './js/api.js';

        const usuarioId = localStorage.getItem('usuario_id');
        const statusDiv = document.getElementById('status-msg');

        // Verificar sesión
        if (!usuarioId) {
            window.location.href = 'index.html';
        } else {
            document.getElementById('user-display').innerText = `ID Usuario: ${usuarioId}`;
        }

        // Logout
        document.getElementById('logout-btn').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.clear();
            window.location.href = 'index.html';
        });

        function showMsg(msg, type) {
            statusDiv.className = type;
            statusDiv.innerText = msg;
            statusDiv.style.display = 'block';
        }

        // --- LÓGICA DE VISTA PREVIA (NUEVO) ---
        const fileInput = document.getElementById('pdf-file');
        const previewContainer = document.getElementById('preview-container');
        const pdfPreview = document.getElementById('pdf-preview');
        const fileNameDisplay = document.getElementById('file-name-display');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            
            if (file && file.type === "application/pdf") {
                // Crear una URL temporal para el archivo seleccionado
                const fileUrl = URL.createObjectURL(file);
                
                // Asignar al iframe y mostrar contenedor
                pdfPreview.src = fileUrl;
                fileNameDisplay.textContent = `Archivo seleccionado: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                previewContainer.style.display = 'block';
            } else {
                previewContainer.style.display = 'none';
            }
        });
        // ---------------------------------------

        // Emitir Certificado
        document.getElementById('btn-cert').addEventListener('click', async () => {
            statusDiv.style.display = 'none';
            try {
                const res = await emitirCertificado(usuarioId);
                const mensaje = res.mensaje || JSON.stringify(res);
                showMsg(`Certificado: ${mensaje}`, 'success');
            } catch (err) {
                showMsg(`Error: ${err.message}`, 'error');
            }
        });

        // Firmar PDF
        document.getElementById('sign-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            statusDiv.style.display = 'none';
            
            if(fileInput.files.length === 0) return;

            try {
                showMsg("Generando firma criptográfica...", "info");
                
                const blob = await firmarPDF(usuarioId, fileInput.files[0]);
                
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `firma_${Date.now()}.bin`; 
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                showMsg("¡Firmado! Se ha descargado el archivo .bin de la firma.", "success");
            } catch (err) {
                showMsg(`Error al firmar: ${err.message}`, 'error');
            }
        });
    </script>
</body>
</html>
