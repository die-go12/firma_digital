<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Firma Digital</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="logo"> Sistema de Firma Digital</div>
        <nav><a href="verificar.html">Ir a Verificador Público</a></nav>
    </header>

    <div class="container">
        <h2>Bienvenido</h2>
        <p>Identifícate o crea una cuenta para firmar documentos de forma segura.</p>

        <div class="card">
            <h3> Crear Nueva Identidad</h3>
            <form id="register-form">
                <div class="form-group">
                    <label>Nombre Completo</label>
                    <input type="text" id="nombre" required placeholder="Tu nombre real">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="correo@ejemplo.com">
                </div>
                <button type="submit" class="btn btn-success">Crear Usuario</button>
            </form>
        </div>

        <div class="card">
            <h3> Ya tengo cuenta</h3>
            <form id="login-form">
                <div class="form-group">
                    <label>ID de Usuario</label>
                    <input type="number" id="login-id" placeholder="Ej: 1" required>
                </div>
                <button type="submit" class="btn">Ingresar al Dashboard</button>
            </form>
        </div>
        
        <div id="status-msg"></div>
    </div>

    <script type="module">
        import { crearUsuario } from './js/api.js';

        const statusDiv = document.getElementById('status-msg');

        function showMsg(msg, type) {
            statusDiv.className = type;
            statusDiv.innerText = msg;
            statusDiv.style.display = 'block';
        }

        // Registro
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value.trim();
            const email = document.getElementById('email').value.trim();

            showMsg("Conectando con el servidor...", "info"); // Feedback inmediato

            try {
                const data = await crearUsuario(nombre, email);
                // Guardamos datos en sesión local
                localStorage.setItem('usuario_id', data.id);
                localStorage.setItem('usuario_nombre', data.nombre);
                
                showMsg(`¡Éxito! Usuario creado (ID: ${data.id}). Entrando...`, 'success');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
            } catch (err) {
                showMsg(err.message, 'error');
            }
        });

        // Login Simulado
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('login-id').value.trim();
            if(id) {
                localStorage.setItem('usuario_id', id);
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
